name: Generate AI rules

# 在上游（blackmatrix7 / VPSDance）更新后重新生成 6 张 AI 表并提交。
# 完全跑在 GitHub 服务器上，与本机（launchd）无关。
on:
  schedule:
    # 09:17 北京时间 = 01:17 UTC；21:17 北京 = 13:17 UTC（与原先 launchd 节奏一致）
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:          # 手动补跑
  push:
    branches: [main]
    paths:                    # 只改了生成器/校验/手写表就重建（规则表由 workflow 自己提交，不触发）
      - "refresh-ai-lists.sh"
      - "check-ai-lists.sh"
      - "to-clash.sh"
      - "check-clash.sh"
      - "AI-Supplement*.list"
      - ".github/workflows/generate.yml"

permissions:
  contents: write             # 允许 bot 提交

concurrency:
  group: generate-ai-rules    # 避免定时与手动同时跑
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # check-clash.sh 需要 python3 的 yaml 模块。ubuntu-latest 预装 pyyaml，
      # 但 ubuntu-26 迁移在即、不保证 —— 显式装上，把隐式假设变成确定依赖。
      - name: 确保 pyyaml（Clash 校验依赖）
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - name: Sanity — 敏感文件不得入库
        run: |
          if git ls-files | grep -qE '\.conf$|\.bak|lll\.conf'; then
            echo "::error::仓库跟踪了敏感文件（lll.conf/.bak/.conf），中止"
            git ls-files | grep -E '\.conf$|\.bak|lll\.conf'
            exit 1
          fi

      - name: 生成（严格模式：源失败/缩水即失败）
        env:
          CI_STRICT: "1"
        run: ./refresh-ai-lists.sh

      - name: 校验产物（格式 / 关键国内 AI 域名 / SaaS 泄漏 / 隔离 / 去重 / 纯度）
        run: ./check-ai-lists.sh

      - name: 增量语义审查（新增域名命中 sso./login./telemetry. 等模式即失败）
        run: |
          chmod +x check-novel.sh
          # 与本次 checkout 的 HEAD 比 —— CI 里 HEAD 就是 main 的上一次状态
          ./check-novel.sh HEAD

      - name: 存活性闸门（新增域名必须能解析）
        run: |
          chmod +x check-liveness.sh
          ./check-liveness.sh HEAD

      - name: 品牌串表检查（提交前 —— 别家域名不得进本品牌表）
        run: |
          chmod +x check-brand-isolation.sh
          ./check-brand-isolation.sh

      - name: 转换 Clash / mihomo rule-provider
        run: |
          chmod +x to-clash.sh
          ./to-clash.sh

      - name: 校验 Clash 产物（可解析 / 数量对账 / 类型白名单）
        run: |
          chmod +x check-clash.sh
          ./check-clash.sh

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 两套产物一起提交：Surge 表 + Clash provider（同一次 CI 落地，保证二者同源同版本）。
          git add 'AI-*.list' 'clash/'
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          SUMMARY=$(git diff --cached --numstat -- '*.list' 'clash/' | awk '{a+=$1;d+=$2} END{printf "+%d/-%d 行", a, d}')
          git commit -m "chore: refresh AI rules ($SUMMARY) [skip ci]"
          # 竞态兜底：checkout 期间若有人手动 push，远端会领先。
          # 重试：先 rebase 到最新 main（规则表不会被手动改动，冲突概率极低），再 push。
          # 注意：循环用尽仍失败必须显式 exit 1 —— 否则步骤会"静默成功"，
          # CI 显示绿色但新表根本没推上去（曾有此缺陷）。
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push 被拒，尝试 rebase 后重试 (#$i)…"
            git pull --rebase --autostash origin main || { echo "::error::rebase 冲突，需人工处理"; exit 1; }
          done
          if [ "$ok" != 1 ]; then
            echo "::error::push 重试 3 次仍失败，新规则未推送"
            exit 1
          fi

      # 推送后再查一遍 —— 校验的是**远端真正落地的内容**，而不是工作区。
      # 用户要求「跑完提交后再检查品牌串表」：提交前那道闸门是拦截，
      # 这道是确认（rebase 重试、并发推送等情况下，落地内容可能与本地不同）。
      - name: 提交后再查（拉回远端内容重验，确认落地无串表）
        run: |
          chmod +x check-brand-isolation.sh check-clash.sh
          git fetch -q origin main
          # 用远端 main 的内容重建工作区文件再验（不改 HEAD，只取文件）
          git checkout -q origin/main -- 'AI-*.list' 'clash/' 2>/dev/null || true
          echo "── 校验远端 main 的实际内容 ──"
          git log -1 --format='  commit: %h  %s' origin/main
          ./check-brand-isolation.sh
          ./check-ai-lists.sh | tail -4
          ./check-clash.sh | tail -2
