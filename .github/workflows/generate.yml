name: Generate AI rules

# 在上游（blackmatrix7 / VPSDance）更新后重新生成 6 张 AI 表并提交。
# 完全跑在 GitHub 服务器上，与本机（launchd）无关。
on:
  schedule:
    # 09:17 北京时间 = 01:17 UTC；21:17 北京 = 13:17 UTC（与原先 launchd 节奏一致）
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:          # 手动补跑
  push:
    branches: [main]
    paths:                    # 只改了生成器/校验/手写表就重建（规则表由 workflow 自己提交，不触发）
      - "refresh-ai-lists.sh"
      - "check-ai-lists.sh"
      - "AI-Supplement*.list"
      - ".github/workflows/generate.yml"

permissions:
  contents: write             # 允许 bot 提交

concurrency:
  group: generate-ai-rules    # 避免定时与手动同时跑
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sanity — 敏感文件不得入库
        run: |
          if git ls-files | grep -qE '\.conf$|\.bak|lll\.conf'; then
            echo "::error::仓库跟踪了敏感文件（lll.conf/.bak/.conf），中止"
            git ls-files | grep -E '\.conf$|\.bak|lll\.conf'
            exit 1
          fi

      - name: 生成（严格模式：源失败/缩水即失败）
        env:
          CI_STRICT: "1"
        run: ./refresh-ai-lists.sh

      - name: 校验产物（格式 / 关键国内 AI 域名 / SaaS 泄漏）
        run: ./check-ai-lists.sh

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'AI-*.list'
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          SUMMARY=$(git diff --cached --numstat -- '*.list' | awk '{a+=$1;d+=$2} END{printf "+%d/-%d 行", a, d}')
          git commit -m "chore: refresh AI rules ($SUMMARY) [skip ci]"
          # 竞态兜底：checkout 期间若有人手动 push，远端会领先。
          # 重试：先 rebase 到最新 main（规则表不会被手动改动，冲突概率极低），再 push。
          for i in 1 2 3; do
            if git push; then break; fi
            echo "push 被拒，尝试 rebase 后重试 (#$i)…"
            git pull --rebase --autostash origin main || { echo "::error::rebase 冲突，需人工处理"; exit 1; }
          done
